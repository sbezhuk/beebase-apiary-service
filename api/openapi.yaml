openapi: 3.0.3
info:
  title: BeeBase Apiary Service API
  description: >
    Apiary management service for BeeBase, an open-source backend for a
    beekeeper management application split into microservices. Access
    tokens are issued by auth-service (see its OpenAPI spec); this
    service verifies them against auth-service's public key and never
    trusts a userID from anywhere but a verified token.

    Photos and other files are uploaded directly to media-service (see its
    OpenAPI spec) independently of any apiary - upload doesn't require one
    to exist yet, and this service never receives file bytes. `images` on
    an apiary is the set of media IDs this service itself stores and
    returns - the source of truth for what's referenced, not a
    media-service round trip - settable via POST (reference immediately
    on creation) or PUT (replace the set wholesale). Every id is verified
    against media-service (a plain ownership check, not a mutating call)
    before being accepted; an id that doesn't exist, was deleted, or
    belongs to a different user is rejected. There's no exclusivity
    between apiaries/hives - the same media id may be referenced by more
    than one. Removing an id from `images` only drops the reference; it
    does not delete the underlying file (deleting the whole apiary does
    delete every file it references).
  version: 0.1.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: apiaries
    description: Create, read, update, and delete a user's own apiaries.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      description: Always returns 200 while the process is running. Has no dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      security: []
      description: Returns 200 only if the database is reachable.
      responses:
        "200":
          description: The service is ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/apiaries:
    post:
      tags: [apiaries]
      summary: Create an apiary
      description: >
        images, if given, is referenced immediately: each id is verified
        against media-service (it must belong to the caller) before the
        apiary is created - an unknown id or someone else's is rejected
        and no apiary is created. Omitting images (or sending an empty
        array) creates an apiary with no photos; more can be added
        afterward via PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiaryCreateRequest" }
      responses:
        "201":
          description: Apiary created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiaryResponse" }
        "400":
          description: Request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [apiaries]
      summary: List the authenticated user's apiaries
      description: >
        Returns only apiaries owned by the caller — never another user's —
        as a page of results. Omitting page/limit falls back to page=1,
        limit=20. Each item's `images` reflects that apiary's actual
        attached media ids - it's a local column now, not a per-item
        media-service round trip, so listing carries no extra cost to
        include it.
      parameters:
        - name: page
          in: query
          description: 1-indexed page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of the caller's apiaries.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApiaryResponse" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: page or limit is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/apiaries/{apiaryId}:
    parameters:
      - name: apiaryId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [apiaries]
      summary: Get one of the authenticated user's apiaries
      description: >
        Returns 404 both when apiaryId doesn't exist and when it belongs
        to a different user — the two cases are indistinguishable to the
        caller, by design.
      responses:
        "200":
          description: The apiary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiaryResponse" }
        "400":
          description: apiaryId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such apiary, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [apiaries]
      summary: Replace an apiary's editable fields
      description: >
        Full replacement (PUT semantics), not a partial patch, for name,
        location, description, lat, and lon. `images` is the one
        exception: omitting it (or sending JSON null) leaves the current
        set untouched, while sending an array (including an empty one)
        replaces it wholesale - every id is verified against
        media-service (it must belong to the caller) before anything
        changes. Dropping an id from the list only removes the reference;
        it does not delete the underlying file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiaryUpdateRequest" }
      responses:
        "200":
          description: The updated apiary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiaryResponse" }
        "400":
          description: >
            apiaryId is not a valid UUID, the request failed validation, or
            images contains an id that doesn't belong to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such apiary, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [apiaries]
      summary: Delete an apiary
      description: Soft delete — the row is retained (deleted_at is set) for future sync support.
      responses:
        "204":
          description: The apiary is deleted (or already was).
        "400":
          description: apiaryId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such apiary, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by auth-service's /api/v1/auth/login (or /register or /refresh).

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    ApiaryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        location: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Latitude of the apiary, in decimal degrees.
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Longitude of the apiary, in decimal degrees.
        images:
          type: array
          items: { type: string, format: uuid }
          description: >
            Media IDs (returned by media-service's upload endpoint) to
            reference immediately. Each must belong to the caller; omit
            this field (or send an empty array) to create an apiary with
            no photos.

    ApiaryUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        location: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Latitude of the apiary, in decimal degrees.
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Longitude of the apiary, in decimal degrees.
        images:
          type: array
          items: { type: string, format: uuid }
          description: >
            The desired final set of media IDs (returned by media-service's
            upload endpoint) referenced by this apiary. Omit this field (or
            send null) to leave the current set untouched; send an array
            (including an empty one) to replace it wholesale. Each id must
            belong to the caller. Dropping an id only removes the
            reference - it does not delete the underlying file.

    ApiaryImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        image_url:
          type: string
          format: uri
          description: >
            The authenticated URL to fetch or display this image's
            content from (media-service's GET /media/{id}/download,
            reverse-proxied by the gateway). Built fresh on every
            response - if the underlying file ever changes, this URL's
            id stays the same but its content does not, so clients
            should not cache a fetched image keyed only by this URL
            without also checking for staleness.

    ApiaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        location: { type: string }
        description: { type: string }
        lat: { type: number, format: double, nullable: true }
        lon: { type: number, format: double, nullable: true }
        images:
          type: array
          items: { $ref: "#/components/schemas/ApiaryImage" }
          description: >
            The media currently attached to this apiary, in every
            response including list items (see GET /apiaries) - never
            null, empty when there are no photos.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Metadata describing the requested page relative to the full result set.
      required: [page, limit, total, total_pages, has_next, has_previous]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, description: Total matching rows across all pages., example: 125 }
        total_pages: { type: integer, example: 7 }
        has_next: { type: boolean }
        has_previous: { type: boolean }

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - apiary_not_found
                - invalid_apiary_id
                - missing_authorization
                - invalid_access_token
                - invalid_body
                - internal_error
              example: apiary_not_found
            message: { type: string, example: apiary not found }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: >
                Field name to error code. Each value is a stable key (not a
                human-readable message) meant to be localized client-side.
                "images" carries "images_invalid" when an entry isn't a
                well-formed UUID, or "image_not_found" when an entry is a
                well-formed UUID that doesn't belong to the caller
                (whether because it doesn't exist, was deleted, or
                belongs to a different user - these are deliberately
                indistinguishable, the same non-leaking convention
                apiary_not_found already follows).
              additionalProperties:
                type: string
                enum:
                  - name_required
                  - name_too_long
                  - location_too_long
                  - description_too_long
                  - lat_out_of_range
                  - lon_out_of_range
                  - images_invalid
                  - image_not_found
                  - invalid_page
                  - invalid_limit
              example: { name: "name_required" }
